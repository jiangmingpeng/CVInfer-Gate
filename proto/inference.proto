//protobuff的中间件


syntax = "proto3";

package inference;

// 定义检测请求
message DetectRequest {
    bytes image_data = 1;  // 图片的二进制数据（比如 JPEG 编码的字节流）
}

// 定义单个检测结果
message Detection {
    int32 class_id = 1;
    string label = 2;
    float confidence = 3;
    int32 x1 = 4;
    int32 y1 = 5;
    int32 x2 = 6;
    int32 y2 = 7;
}

// 定义检测响应
message DetectResponse {
    bool success = 1;
    string message = 2;
    repeated Detection detections = 3;
}

// [T43] 健康检查 / 自述
message HealthRequest {}

message HealthResponse {
    bool serving = 1;      // 进程是否在正常服务
    string version = 2;    // 版本号
    int64 uptime_ms = 3;   // 已运行时长(ms)
    string detail = 4;     // 附加上下文(如 "detector=yolov8_detector")
}

// 定义 gRPC 服务
service DetectionService {
    rpc Detect (DetectRequest) returns (DetectResponse);
    // [T43] 探针: 容器 healthcheck / systemd / k8s 的活性检查
    //   同样**需要鉴权**(空 token = 不鉴权), 与 T42 的口径一致:
    //   50051 不暴露任何匿名接口。
    rpc Health (HealthRequest) returns (HealthResponse);
}