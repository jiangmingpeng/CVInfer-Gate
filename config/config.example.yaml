# ============================================================
# CVInfer-Gate 全量配置模板(仓库里**唯一**的模板文件):
#     cp config/config.example.yaml config/config.yaml
#   * 不含任何口令/token: 都由环境变量注入(ConfigParser::expandEnv 展开 ${VAR}):
#       DB_PASSWORD       MySQL 口令(docker 跑时 = docker/.env 的 MYSQL_ROOT_PASSWORD)
#       VLM_TOKEN         [T41] 复核服务端 token(空 = 两端都不鉴权)
#       GRPC_AUTH_TOKEN   [T42] 主服务 token(空 = 不鉴权)
#       ALERT_PUSH_URL / ALERT_TOKEN  [T43] 告警 webhook 地址/自定义头
#   * 真口令别写回本文件 —— 随仓库走的只有模板; config/config.yaml 被 .gitignore 忽略。
#   * 段索引(按文件出现顺序):
#       app      日志 / 轮转                          sensors  [D] 非视频传感器(雷达/红外)
#       fusion   [D] 决策级融合                        review   [C] 大模型异步复核
#       cascade  [B] 级联复核(灰区 -> 二级分类器)      video    视频源(file | rtsp)
#       pipeline 推理 worker 数                        database 落库 + 不可用降级
#       alert    告警去重 + webhook 外发               grpc     对外服务 + 鉴权
#       metrics  [T43] /metrics 端点
#   * 其余场景配置: config.test.yaml(开 Phase B+C+D) / config.ops.yaml(运维三件套) /
#     config.rtsp.yaml(RTSP); 模型清单在 config/model_config.yaml(用 --model-config 单独加载)。
#   * 旧版三段式(video/database/grpc)与旧单模型格式仍可解析, 缺的键走默认值。
# ============================================================

app:
  log_level: "info"       # trace|debug|info|warn|error
  log_file: ""            # 空 = 仅输出到控制台; 建议 "logs/cvinfer.log"
  # ---- [T43] 日志文件轮转(仅当 log_file 非空且 log_max_size_mb > 0 时生效) ----
  log_max_size_mb: 0      # 0 = 不轮转(一直追加); 建议 10 或 64
  log_keep_files: 3       # 保留的归档数(app.log.1 ... app.log.N); 0 = 只留当前文件

# [Phase D] 只列**非视频**传感器: 视频仍由 video: 段描述, 并自动作为融合的时间基准。
#   雷达(无像素框) => 融合走"标签关联"; 红外(带热目标框) => 走"IoU 关联"。
#   backend: stub = 无硬件合成源; file = 逐行回放(格式/样例见 scripts/sensor_replay_demo.txt)。
sensors:
  - kind: radar
    name: radar_front
    backend: stub          # 无硬件也能跑
    rate_hz: 10
    labels: ["person"]     # 标签白名单(空 = 不过滤)

# [Phase D] 决策级融合: 各模态各自出结论后再融合(只调 confidence + 补 distance_m 等元数据,
#   原始视觉置信度保留在 vision_confidence 便于追溯)。enabled=true 且 sensors 非空才生效。
fusion:
  enabled: true
  level: decision
  time_tolerance_ms: 50    # 时间对齐容差(±ms): 至少覆盖"采样间隔+推理耗时", 否则对齐率偏低
  match_iou: 0.30          # 视觉框 vs 传感器框(红外)关联阈值; 传感器无框时退化为标签关联
  sensor_weight: 0.35      # fused = (1-w)*视觉 + w*传感器; 调大 = 更信传感器
  emit_sensor_only: false  # 未关联的传感器目标是否独立输出(仅自带框者输出; 无框雷达只计数)
  adopt_sensor_label: false
  buffer_capacity: 256     # 采样缓冲(满则丢最旧)

# [Phase C] 大模型异步复核: 命中触发的目标裁 ROI 异步送审, **确认才告警**。
#   全程异步(画框/写视频/入库不受影响), 有界队列满则丢最旧; 没有服务端也有效(走 unavailable)。
#   服务端二选一:
#     python3 -m vlm_review.server --backend mock|openai --base-url ... --model ...   # 真 VLM/mock
#     python3 scripts/mock_review_server.py --port 50052                             # 规则 mock
review:                    # Phase C：没有复核服务端也有效
  enabled: true
  endpoint: "127.0.0.1:50052"
  timeout_ms: 1000
  queue_size: 64
  worker_threads: 2
  trigger: { labels: ["person"], min_conf: 0.50, max_conf: 1.00 }
  roi_padding: 0.10
  prompt: "判断该人员是否未佩戴安全帽"
  alert_type: "安全帽缺失"
  alert_on_failure: true   # 无服务时走兜底告警 → 落到 db_fallback.csv
  # ---- [T37] 接真 VLM(OpenAI 兼容服务 / 本地 Qwen2.5-VL)时的传输与鉴权 ----
  max_message_size_mb: 16  # ROI JPEG 较大, 默认 4MB 会超限
  keepalive_time_ms: 20000 # HTTP/2 长连接保活(0 = 不设置)
  auth_token: "${VLM_TOKEN:-}"  # 非空 => 每次调用带 authorization: Bearer <token>
  health_check: true       # 启动时探一次 Health(仅日志, 失败不阻断)

# [Phase B] 级联复核: 主模型只把**灰区**目标(置信度落在 [min_conf, max_conf) 且类别命中)
#   裁 ROI 交二级分类器二次确认。确认 => 保留并回写 sub_label/sub_confidence;
#   否决 => 按 drop_rejected 决定是否丢弃; 二级不可用(繁忙/失败) => 保留主结果(降级, 不误杀)。
#   ⚠ secondary 必须与 config/model_config.yaml 里的模型名**完全一致**, 否则静默退化为单模型。
#   ⚠ accept_label 要与该分类器 labels 文件里的类别名对齐(本仓库 = safety_helmet)。
cascade:
  enabled: false                 # 置 true 才构建 CascadeEngine; false = 单模型直通
  primary: yolov8_detector       # 主筛模型名(留空 = 首个 detector)
  secondary: helmet_classifier   # 二级分类器(需在 model_config.yaml 里以 role=classifier 注册)
  trigger:
    labels: ["person"]           # 只对这些类别触发复核(留空 = 所有类别)
    min_conf: 0.40               # 灰区下界(含)
    max_conf: 0.90               # 灰区上界(不含)
  roi_padding: 0.10              # ROI 相对目标宽高外扩比例
  accept_label: "safety_helmet"  # 视为"通过"的二级标签(留空 = 只按置信度判定)
  accept_conf: 0.50              # 通过所需的最低二级置信度
  drop_rejected: true            # 二级否决时是否丢弃该目标
  boost_on_confirm: false        # 确认时是否用二级置信度替换主置信度

video:
  source_type: "rtsp"     # file | rtsp
  # source_type: "file"     # file | rtsp
  # source_path: "test.mp4" # 本地视频文件 / RTSP 地址 (按需修改)
  source_path: "rtsp://127.0.0.1:8554/live" # 本地视频文件 / RTSP 地址 (按需修改)
  # ⚠ docker 跑时: 容器内的 127.0.0.1 是容器自身，不是宿主机 => 宿主机上的 mediamtx
  #   要写 rtsp://host.docker.internal:8554/live (compose 已配 extra_hosts);
  #   或改 source_type: file 并用挂载进容器的 /app/test.mp4。
  # source_path: "rtsp://127.0.0.1:8554/live" # 本地视频文件 / RTSP 地址 (按需修改)
  target_fps: 0           # 0 = 不限速; >0 = 按目标帧率抽帧限速
  frame_interval: 1       # 每 N 帧取 1 帧
  queue:
    max_size: 24          # 有界队列容量 (防内存膨胀)
    policy: "drop_oldest" # drop_oldest | block

pipeline:
  worker_threads: 2       # 推理 worker 数 / 引擎池大小

database:
  # host: "tcp://mysql-db:3306"
  host: "127.0.0.1"
  user: "root"
  password: "${DB_PASSWORD:-}"
  dbname: "cv_infer"
  pool_size: 4            # 连接池大小
  batch_size: 20          # [T11] 攒够 20 条批量插入 (队列容量 = batch_size*16)
  flush_interval_ms: 1000 # [T11] 或每隔 1 秒批量冲刷 (兼作空闲等待间隔)
  max_retries: 10         # 初次连接最大重试次数
  # ---- [T11] 数据库不可用时的降级与重试策略 ----
  fallback_path: "db_fallback.csv"  # 本地 CSV 降级文件(空 = 禁用降级)
  reconnect_interval_ms: 30000      # 不可用后每隔 30s 重试一次
  reconnect_after_writes: 100       # 或累计 100 次冲刷后重试一次

alert:
  dedup:
    enabled: true       # false = 完全等价于旧行为
    iou: 0.30           # 判"同一目标"的框重叠阈值
    cooldown_ms: 5000   # 冷却窗(按最近一次命中刷新)
    max_entries: 256    # 记忆上限(有界)
  # ---- [T43] 告警推送(webhook): 告警不再只躺在库里, 而是"有人知道" ----
  #   enabled=false 时只落库(与改造前完全一致)。推送失败/队列满**不影响**落库与推理。
  push:
    enabled: false
    url: "${ALERT_PUSH_URL:-http://127.0.0.1:8899/alert}"  # 只支持 http://(无 TLS)
    timeout_ms: 3000        # 单次请求超时(连接+收发)
    max_retries: 2          # 失败重试次数(不含首次)
    retry_backoff_ms: 200    # 退避基数(第 n 次等待 base*2^(n-1), 上限 5s)
    max_queue: 256          # 有界队列(满则丢最旧, 与帧队列同策略)
    drain_timeout_ms: 5000  # 退出时最多再等多久把队列发完
    header_name: ""         # 可选自定义头(如 "x-alert-token")
    header_value: ""        # 其值(建议 "${ALERT_TOKEN:-}", 口令不进 git)

grpc:
  port: 50051
  timeout_ms: 5000        # 引擎借用超时 / 客户端 deadline
  max_message_size_mb: 16 # 收发消息上限 (T8; 默认 4MB 会挡住大图)
  worker_threads: 0       # 同步服务线程配额 (T8; 0 = gRPC 默认)
  keepalive_time_ms: 20000 # HTTP/2 keepalive (T8)
  # [T42] 主服务鉴权: 非空 => 每个 RPC 都要 authorization: Bearer <token>;
  #   空 = 不鉴权(等价改动前)。token 走环境变量 => 别把真 token 写在这里。
  auth_token: "${GRPC_AUTH_TOKEN:-}"

# ---- [T43] 指标端点(Prometheus 抓取) ----
# enabled=false 时不监听任何端口(零行为变化)。端点**无鉴权**, 只应暴露在受信网络:
#   * 容器内用 bind 0.0.0.0 + compose 的 expose(不发布到宿主机), Prometheus 走容器网络;
#   * 裸机建议 bind 127.0.0.1, 或防火墙只放行抓取端。
metrics:
  enabled: false
  bind: "0.0.0.0"     # 裸机跑请改成 127.0.0.1
  port: 9100          # 避开 50051(gRPC) / 50052(复核) / 3306(MySQL)
