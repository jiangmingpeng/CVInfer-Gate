  #   acquire_timeout_ms: 2000
  #   device: CPU
  #   performance_mode: latency
  #   num_threads: 4



  # ---- 主模型: YOLOv8 检测器 ----
  - name: yolov8_detector
    role: detector
    xml_path: models/yolov8n.xml
    bin_path: models/yolov8n.bin
    labels_path: models/labels.txt
    input_width: 640
    input_height: 640
    conf: 0.25                 # 也可写作 thresholds: { conf: 0.25, nms: 0.45 }
    nms: 0.45
    pool_size: 2               # 引擎池大小; 0 = 按 pipeline.worker_threads 兜底
                               #   约束: worker_threads 必须 <= pool_size(借不到引擎的 worker 会白等)
                               #   引擎数只影响内存/启动时间, 不影响吞吐 ⇒ 取最小够用值(详见 PROJECT_NOTES §20.13)
    acquire_timeout_ms: 2000   # 借引擎超时(ms)

    # ---- 推理性能旋钮(纯 CPU 场景的实测最优值) ----
    # device: 必须显式写 CPU —— 用 AUTO 会让插件去枚举设备, 在带 NPU 插件的 WSL 环境会段错误。
    # num_threads: 4 = 物理核数, 实测吞吐最优(再加只会多烧 CPU; 推导见 PROJECT_NOTES §20.13/§20.14)。
    device: CPU
    performance_mode: latency
    num_threads: 4


