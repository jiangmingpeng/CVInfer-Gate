# ============================================================
# 模型配置模板 (多模型注册)
# ------------------------------------------------------------
# 说明:
#   1) 本文件是"多模型"格式示例; 旧的单模型格式 (model: + thresholds:)
#      仍然完全兼容, ConfigParser 会自动识别并规整为长度 1 的模型列表。
#   2) 本文件**就是**运行期读取的 config/model_config.yaml（与 config/config.yaml 并列接入）；
#      如需回到“单模型”路径，改用 model: + thresholds: 格式即可（见下方兼容说明）。
#   3) 角色 role:
#        detector   -> 目标检测 (当前实现: YoloDetector)
#        classifier -> 分类/行为识别 (BehaviorClassifier)
#        reviewer   -> 交 review 层(复用 gRPC)处理, 不走模型工厂
# ============================================================

models:

  #   # ---- 新主模型: 图书馆占座检测 ----
  # - name: library_detector
  #   role: detector
  #   xml_path: "models/library_det.xml"
  #   bin_path: "models/library_det.bin"
  #   labels_path: "models/library_labels.txt" # 里面写4行: person, bag, laptop, book
  #   input_width: 640
  #   input_height: 640
