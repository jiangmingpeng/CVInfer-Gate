  #   role: classifier
  #   xml_path: models/helmet_cls.xml
  #   bin_path: models/helmet_cls.bin
  #   labels_path: models/helmet_labels.txt
  #   input_width: 224
  #   input_height: 224
  #   conf: 0.50                 # 分类器不使用(仅检测器需要), 保留字段兼容
  #   nms: 0.45
  #   pool_size: 1
  #   acquire_timeout_ms: 2000
