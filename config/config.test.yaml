# ============================================================
# CVInfer-Gate 测试运行配置 (2026-xx 重建)
# ------------------------------------------------------------
# 用途: 把 Phase B(级联) / Phase C(复核) / Phase D(融合) 逐段打开,
#       在**不动**被安全策略锁定的 config/config.yaml 的前提下跑真实链路。
#
# 用法(在 build/ 目录下, 建议用绝对路径, 免得被 CMake POST_BUILD 的
#      config/ 覆盖绕晕):
#     ./CVInfer-Gate --config /home/jmp/CVInfer-Gate/config/config.test.yaml \
#                    --model-config /home/jmp/CVInfer-Gate/config/model_config.yaml
#
# 本配置的默认开关(与文件里各段实际的 enabled 一致 —— 改开关时请同步这一行):
#     review.enabled    = true    ← 需要先起复核服务(否则只看到 unavailable=N)
#     occupancy.enabled = true    ← 规则层先用"座位 zone + 时序"筛, 再送 VLM 复核
#     tracking.enabled  = true    ← 占座/时长门都依赖它
#     cascade.enabled   = false   ← 本文件跑的是"占座"业务(primary=library_detector),
#                                    没有配 secondary 分类器; 想验 Phase B 见 cascade 段注释
#     fusion.enabled    = false   ← 占座业务不需要融合; 想验 Phase D 改成 true(需 sensors)
#
# 占座链路验收(本文件已配好, 跑一次就能看到):
#     1) 启动日志里应有「占座判定: 已启用 (座位数=1, ...)」与各座位的区域尺寸;
#     2) 出现「[占座] 座位 A-12: 检出物品 [laptop], 已连续 N 秒「有物品且无人使用」」
#        —— 这就是送给 VLM 的那段**结构化证据**;
#     3) 退出日志的「占座统计: frames=... occupied_events=N」与每座位最终状态,
#        运维最常问的"现在哪些座位被判占了"就是这几行。
#     ⚠ 演示用的 t_occupied_ms 被调到 2s, 因为测试视频只有 44s;
#       真实业务口径是"人离开 5 分钟" => 生产配置请改回 300000。
#     想脱离视频验证规则本身: ctest -R cv_unit_tests  (Seat* 共 33 条确定性用例)
#
# 想逐段验证就**只改一个开关**:
#     P1-1 只开复核: review.enabled=true, sensors 清空 + fusion.enabled=false
#     P1-2 只开融合: review.enabled=false, fusion.enabled=true
#     P1-3 组合(C+D): review + fusion 同时开(另需 sensors), 见 PROJECT_NOTES §15 验收清单
#
# 前置(复核服务, 否则 review 全部走 unavailable 兜底), 二选一:
#     # A. 确定性 mock(与旧行为一致, 回归用)
#     python3 scripts/mock_review_server.py --port 50052 --mode auto
#     # B. 真 VLM(需先把上游 VLM 起在 :8000, 如 vLLM/Ollama)
#     #     ⚠️ 本配置的业务是**占座**, 服务端必须用同一场景:
#     #        VLM_SCENARIO=seat_occupancy (或 --scenario seat_occupancy)
#     #        否则服务端的 system prompt 会停在别的业务, 与这里的 prompt 打架。
#     VLM_SCENARIO=seat_occupancy python3 -m vlm_review.server --backend openai \
#         --base-url http://127.0.0.1:8000/v1 --model Qwen/Qwen2.5-VL-7B-Instruct
#
# ⚠️ 时间基: 程序按**当前工作目录**解析相对路径 ⇒ 从 build/ 跑时,
#    video.source_path 的 ../test.mp4 指的是仓库根目录的 test.mp4(从 build/ 启动)。
# ============================================================

# ⚠ 【真实踩到的坑】日志配置在 **app 段**里, 字段名是 log_level / log_file。
#   写成顶层的 log: {level, file} **不会被读取**(ConfigParser 只认 app.*) ⇒
#   表现为"明明配了日志文件却一直不生成" —— 网页的「事件时间线」自然永远是空的。
# 规则层的事件(占座/告警)只有落到**文件**里, 网页才读得到:
#   web_gateway 默认读 <RESULT_DIR>/logs/cvinfer.log (= build/logs/cvinfer.log),
#   也可用环境变量 RESULT_LOG 指定别的路径。
app:
  log_level: "info"              # trace|debug|info|warn|error
  log_file: "logs/cvinfer.log"   # 相对 build/ (从 build/ 启动); 目录不存在会自动创建
  log_max_size_mb: 10            # 0 = 不轮转; >0 = 单文件超限即轮转
  log_keep_files: 3

video:
  source_type: file
  # source_type: rtsp
  source_path: ../test.mp4   # 相对 build/ (从 build/ 启动程序)
  # source_path: rtsp://127.0.0.1:8554/live   # 相对 build/ (从 build/ 启动程序)
  target_fps: 10          # 文件源限速解码 ⇒ 每帧都推理, 不积累延迟
  frame_interval: 1       # 想要更高吞吐就只改这个(见 PROJECT_NOTES §16.1)
  # 结果视频上的可视化(只影响观感, 不影响判定/落库/告警)
  # 独立成配置项的原因: 同一个线宽在不同分辨率的源上观感差很多 ——
  #   原来写死 2px, 在 720x1280 上还行, 换到 544x592 就又粗又糊(MJPG 还会糊开成 ~3px)。
  box_thickness: 1        # 框线宽(px); <=0 = 不画框
  label_scale: 0.45       # 框上标签字号; <=0 = 不写字
  queue:
    max_size: 24
    policy: drop_oldest

pipeline:
  worker_threads: 2       # 约束: worker_threads <= models[].pool_size

# [P0-2] 口令不落明文(ConfigParser::expandEnv 会展开 ${VAR}):
#   本地直接跑: export DB_PASSWORD=<MySQL 口令>;  docker 跑: 填 docker/.env
#   ⚠ 历史提交里此处曾是明文口令 ⇒ 该口令视为**已泄露**, 请轮换。
database:
  host: "127.0.0.1" #在数据库服务中默认采用3306端口
  # user: user
  user: "root"
  password: "${DB_PASSWORD:-12345678jmp}"
  dbname: cv_infer
  pool_size: 4
  batch_size: 20
  flush_interval_ms: 1000
  max_retries: 10
  fallback_path: db_fallback.csv      # 相对 build/ (库不可用时的降级落盘)
  reconnect_interval_ms: 30000
  reconnect_after_writes: 100

grpc:
  port: 50051
  timeout_ms: 5000
  max_message_size_mb: 16
  worker_threads: 0
  keepalive_time_ms: 20000
  # 非空 => 主服务每个 RPC 都要 authorization: Bearer <token>(空 = 不鉴权)
  auth_token: "${GRPC_AUTH_TOKEN:-}"

# ---- Phase B: 级联复核 (主筛灰区 -> 二级分类器复核) ----
# ⚠️ 占座业务**用不到**这一段: 本仓库现成的 role=classifier 只有一个与占座无关的
#    样例(注册写法见 config/model_config.yaml 的注释块)。所以这里 enabled=false、
#    secondary 留空 —— 本文件跑的是"单模型 + 占座规则层 + VLM 复核"。
#    想验 Phase B 机制: 按 model_config.yaml 注释开启样例分类器, 再把 secondary
#    填成它的名字(**必须与模型名完全一致**, 否则 buildCascade() 会“静默退化为
#    单模型”, 表现为 Phase B 没跑但也不报错)。
cascade:
  # enabled: true
  enabled: false
  primary: library_detector       # 留空 = 首个 detector
  secondary: ""                   # 留空/找不到 = 退化为单模型
  trigger:
    labels: ["bag", "laptop"]          # 触发复核
    min_conf: 0.40               # 灰区下界(含)
    max_conf: 0.90               # 灰区上界(不含)
  roi_padding: 0.10              # ROI 外扩 10% 再裁剪
  accept_label: ""               #
  accept_conf: 0.50
  drop_rejected: true            # 二级否决 -> 丢弃该目标
  boost_on_confirm: false

# ---- Phase C: 大模型异步复核(本仓库=客户端, 服务端需另行部署)----
# 只对**灰区/候选**目标送审; 复核**确认才告警**; 不可用时按 alert_on_failure 兜底。
# 本段业务 = 图书馆占座(整条链路):
#   触发(物品) -> 场景 ROI(带桌面/座位) -> VLM(seat_occupancy 场景) -> 确认才告警
review:
  enabled: true
  endpoint: "127.0.0.1:50052"
  timeout_ms: 3000
  queue_size: 64
  worker_threads: 2
  trigger:
    labels: ["bag", "laptop", "book"] # 改为物品触发(占座看的是"物品在哪")
    min_conf: 0.40
    max_conf: 1.00
  roi_padding: 0.10
  # [占座] 场景 ROI: 只裁"一本书"(107x135)大模型看不到桌面/座位/周围的人,
  #        自然无法判断占座 => 以目标中心为基准再放大 3 倍, 并保证最小边长 320px,
  #        把桌面与周边环境一并带进去。
  #        ⚠ 模型输入图变大 => VLM 单次耗时上升, 必要时调大 timeout_ms。
  #        (两键都不写 = 1.0 / 0, 与改造前行为完全一致)
  roi_context_scale: 3.0
  roi_min_side: 320
  # [占座] 时序门: 物品需在画面里**停留 >= 2s** 才送审(占座 = 长期占用),
  #        刚路过/刚建轨的先观望。依赖 tracking.enabled; 0 = 关闭。
  min_dwell_ms: 2000
  # 任务描述(与 VLM 服务端 VLM_SCENARIO=seat_occupancy 的 system prompt 同源语义)
  prompt: "判断该座位是否被长期占座（人离开但物品仍在），注意区分短暂离开"
  alert_type: "图书馆疑似占座违规"
  alert_on_failure: false
  max_message_size_mb: 16
  keepalive_time_ms: 20000
  auth_token: "${VLM_TOKEN:-}"
  health_check: true


# review:
#   enabled: true
#   endpoint: "127.0.0.1:50052"     # mock 或 vlm_review.server 的监听地址
#   timeout_ms: 3000                 # 真 VLM 首包可能较慢, 可适当调大(如 8000)
#   queue_size: 64
#   worker_threads: 2
#   trigger:
#     labels: ["person"]
#     min_conf: 0.50
#     max_conf: 1.00
#   roi_padding: 0.10
#   roi_context_scale: 1.0           # 1 = 只裁目标本身(不需要场景上下文时)
#   roi_min_side: 0                  # 0 = 不补最小边长
#   min_dwell_ms: 0                  # 0 = 不做停留时长闸门
#   prompt: "判断该座位是否被长期占座"
#   alert_type: "图书馆疑似占座违规"
#   alert_on_failure: false          # 拿不到结论(超时/不可用)时默认**不**告警
#   # ---- 接入真 VLM ----
#   max_message_size_mb: 16
#   keepalive_time_ms: 20000
#   auth_token: "${VLM_TOKEN:-}"     # 需鉴权的 VLM 才填; 默认空
#   health_check: true               # 启动时探测 Health: 就绪/未就绪一眼可见

tracking:
  enabled: true

# ---- 占座判定(规则层): 夹在「检测」与「VLM 复核」之间 ----
# 测试视频是图书馆场景(720x1280, 俯拍); 座位 zone 按实际画面里的桌面位置画。
# 判据 C1~C7 见 src/occupancy/SeatOccupancyAnalyzer.h; 每条都有确定性单测。
#
# ⚠ 时基提醒: 本层用的是**墙钟时间**(不是视频时间戳, 因为 rtsp 下没有可靠的帧时间戳)。
#   跑文件源时建议配 target_fps(本文件=10), 让墙钟≈视频时间, 结果才直观。
occupancy:
  enabled: true
  # COCO 里**没有** "bag" 这个词 —— 包只会被检出为 backpack(25) / handbag(27)。
  # 而标签匹配是精确相等(SeatOccupancyAnalyzer::isItemLabel 用 std::find),
  # 所以只写 "bag" 时「包占座」永远判不出来, 这三个词必须都列上。
  # 注: 命中 item_labels 的标签会在逐物体送审**之前**被跳过(main.cpp 的
  #     isItemLabel 分流), 所以 review.trigger.labels 无需跟着改。
  item_labels: ["book", "bag", "laptop", "backpack", "handbag"]
  person_label: "person"
  seats:
    # 测试视频里 laptop 反复出现在这一带(x 360~720, y 320~960), 且该区域**从未**
    # 检出 person => 正好是"桌面上放着东西、人不在"的工位。
    # ⚠ 不要把 zone 画得太大: 画到"人坐的地方"就会命中判据 C2(人在使用), 永远不判占座。
    - name: "A-12"
      rect: [360, 320, 360, 640]
  item_seat_overlap: 0.5
  item_person_overlap: 0.5
  # C2「人在用座位」的包含度阈值。0.15 -> 0.30: 15% 太松, 邻座/路过的框与 zone 稍一
  # 重叠就被判成"有人在用这个座位", 占座计时被反复暂停 => 真占座反而漏报(验收片里
  # 表现为"该报的没报")。0.30 要求人确实落在座位上。
  person_seat_iou: 0.30
  # C2 人框最小高度(像素): 滤掉远景小框/误检。0 = 关闭, 但**关闭时远处的路人会误命中
  # C2** => 演示/验收建议给一个下限(本测试源 720x1280, 60 只滤掉"小到不可能是座位上的人")。
  min_person_height_px: 60
  # 演示值: 视频总长 44s, 用真实口径(5 分钟)永远触发不了 => 调到 2s 把链路跑亮。
  t_occupied_ms: 2000
  t_grace_ms: 5000
  vote_n: 10
  vote_m: 7

# ---- Phase D: 多模态决策级融合 ----
# ⚠️ 视频**不写在这里**(由上面的 video: 段描述), 这里只列雷达/红外。
#    只用 stub ⇒ 不需要任何硬件, 且是**确定性**的(自检与端到端结果可复现)。
#    红外(带框)需要 IoU 相交, 而本测试视频里 person 框近乎满画面下半部,
#    stub 红外的框在画面上方 ⇒ IoU=0、关联不上(见 PROJECT_NOTES §14.5);
#    想验"带框关联"请改用 backend: file + scripts/sensor_replay_demo.txt。
sensors:
  - kind: radar
    name: radar_front
    backend: stub
    rate_hz: 10
    labels: ["person"]

fusion:
  enabled: false
  level: decision                  # 校验层只允许 decision
  time_tolerance_ms: 50            # 文件源帧间隔较大, 窗口可适当放宽
  match_iou: 0.30
  sensor_weight: 0.35
  emit_sensor_only: false          # 雷达无框 ⇒ 即便 true 也不会凭空造框
  adopt_sensor_label: false
  buffer_capacity: 256
