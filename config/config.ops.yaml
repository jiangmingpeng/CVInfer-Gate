# ============================================================
# 运维演示配置 —— 一跑就能看见本轮新增的三件事
# ------------------------------------------------------------
#   1) 告警推送(webhook)   2) /metrics 指标端点   3) 日志轮转 + 健康探针
#
# 用法(与其它配置一致: 从 build/ 启动, 相对路径以 build/ 为基准):
#     python3 scripts/alert_receiver.py --port 8899 &          # 假装是"下游通知系统"
#     cd build && ./CVInfer-Gate --config config/config.ops.yaml
#     curl -s http://127.0.0.1:9100/metrics | head -40          # 指标
#     ./CVInfer-Gate --config config/config.ops.yaml --health-check   # 探针(另开终端)
#     kill -TERM <pid>                                          # 看优雅关闭时的推送统计
#
# 刻意不依赖 MySQL / 复核服务:
#   * 库不可用 -> 降级写 db_fallback.csv(不退出);
#   * 复核不可用 -> 走 review.alert_on_failure 兜底告警 —— 正好把推送/指标链路跑满。
# ============================================================

app:
  log_level: "info"
  log_file: "logs/cvinfer.log"   # 相对 build/; 目录不存在会自动创建
  log_max_size_mb: 1             # 单文件上限(设这么小是为了让轮转在短跑里也能看见)
  log_keep_files: 3              # 保留 app.log.1 ~ app.log.3

sensors:
  - kind: radar
    name: radar_front
    backend: stub                # 无硬件也能跑
    rate_hz: 10
    labels: ["person"]

fusion:
  enabled: false
  level: decision
  time_tolerance_ms: 50
  match_iou: 0.30
  sensor_weight: 0.35
  emit_sensor_only: false
  adopt_sensor_label: false
  buffer_capacity: 256


review:
  enabled: true                  # 保持 true，没服务端 => unavailable => 兜底告警(完美测试外发)
  endpoint: "127.0.0.1:50052"
  timeout_ms: 1000
  queue_size: 64
  worker_threads: 2
  trigger: { labels: ["bag", "laptop", "book"], min_conf: 0.40, max_conf: 1.00 } # ★ 改为物品触发
  roi_padding: 0.10
  prompt: "判断该座位是否被长期占座（人离开但物品仍在），注意区分短暂离开" # ★ 改为占座
  alert_type: "图书馆疑似占座违规" # ★ 改为占座告警
  alert_on_failure: true


# review:
#   enabled: true                  # 没有复核服务端 => unavailable => 兜底告警(演示用)
#   endpoint: "127.0.0.1:50052"
#   timeout_ms: 1000
