#   roi_padding: 0.10
#   prompt: "判断该人员是否未佩戴安全帽"
#   alert_type: "安全帽缺失"
#   alert_on_failure: true

video:
  source_type: "file"
  source_path: "../test.mp4"     # 相对 build/ => 仓库根目录的 test.mp4
  target_fps: 0
  frame_interval: 1
  queue:
    max_size: 24
    policy: "drop_oldest"

pipeline:
  worker_threads: 2

database:
  host: "127.0.0.1"
  user: "root"
  password: "${DB_PASSWORD:-12345678jmp}"   # 口令走环境变量, 不进 git
  dbname: "cv_infer"
  pool_size: 4
  batch_size: 20
  flush_interval_ms: 1000
  max_retries: 2                 # 演示配置: 别为连不上库等太久
  fallback_path: "db_fallback.csv"
  reconnect_interval_ms: 30000
  reconnect_after_writes: 100

alert:
  dedup:
    enabled: true
    iou: 0.30
    cooldown_ms: 5000
    max_entries: 256
  # ---- 告警推送(webhook) ----
  push:
    enabled: true
    url: "${ALERT_PUSH_URL:-http://127.0.0.1:8899/alert}"
    timeout_ms: 3000
    max_retries: 2
    retry_backoff_ms: 200
    max_queue: 256
    drain_timeout_ms: 5000
    header_name: "x-alert-token"          # 可选: 让接收端能验一下来源
    header_value: "${ALERT_TOKEN:-}"      # 空 = 不发这个头

grpc:
  port: 50051
  timeout_ms: 5000
  max_message_size_mb: 16
  worker_threads: 0
  keepalive_time_ms: 20000
  auth_token: "${GRPC_AUTH_TOKEN:-}"      # 空 = 不鉴权(探针同样口径)

# ---- 指标端点 ----
metrics:
  enabled: true
  bind: "127.0.0.1"    # 本机演示: 只监听回环。容器里给 Prometheus 抓就写 0.0.0.0
  port: 9100
