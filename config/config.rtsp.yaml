fusion:
  enabled: false
  level: decision
  time_tolerance_ms: 100   # RTSP + frame_interval:3 时帧间隔约 120ms, 窗口太窄会经常对不上
  match_iou: 0.30
  sensor_weight: 0.35
  emit_sensor_only: false
  adopt_sensor_label: false
  buffer_capacity: 256
