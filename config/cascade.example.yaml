# ============================================================
# 级联配置示例 (T16-T19) —— 注意: 本文件不会被程序自动加载!
# ------------------------------------------------------------
# 程序只读取 config/config.yaml。请把下面的 cascade: 段
# 合并到 config/config.yaml 顶层(与 video:/database:/grpc:/pipeline: 同级)。
#
# 语义回顾:
#   主模型(primary) 检出目标 -> 仅"置信度落在灰区 [min_conf, max_conf)
#   且类别命中 trigger_labels"的目标, 才裁剪 ROI 交给二级分类器(secondary)复核。
#     - 复核确认: 保留目标, 回写 sub_label/sub_confidence (供告警/入库)
#     - 复核否决: drop_rejected=true 则丢弃; 否则保留但带 reviewed 标记
#     - 复核不可用(繁忙/失败): 保留主结果(降级, 绝不误杀)
#
# 二级分类器须在 config/model_config.yaml 的 models: 中以 role=classifier 注册
# (见 config/model_config.new.yaml 的 helmet_classifier 示例)。
# ============================================================

cascade:
  enabled: true                 # 置 true 才构建 CascadeEngine; false = 单模型直通
  # enabled: false                 # 置 true 才构建 CascadeEngine; false = 单模型直通
  primary: yolov8_detector       # 主筛模型名(留空 = 首个 detector)
  secondary: helmet_classifier   # 二级分类器模型名(留空/找不到 = 退化为单模型)

  # ---- 触发条件(灰区) ----
  trigger:
    labels: ["person"]           # 只对这些类别触发复核(留空/省略 = 所有类别)
    min_conf: 0.40               # 灰区下界(含)
    max_conf: 0.90               # 灰区上界(不含) —— 越确定越不复核

  # ---- 复核细节 ----
  roi_padding: 0.10              # ROI 相对目标宽高外扩 10% 再裁剪到图像边界
  accept_label: "safety_helmet"    # 视为"通过"的二级标签(留空 = 只按置信度判定)
  accept_conf: 0.50              # 通过所需的最低二级置信度
  drop_rejected: true            # 二级否决时是否丢弃该目标
  boost_on_confirm: false        # 确认时是否用二级置信度替换主置信度
