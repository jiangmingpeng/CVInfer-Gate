
services:
  # MySQL 数据库服务
  mysql-db:
    image: mysql:8.0
    container_name: cv_infer_mysql
    environment:
      MYSQL_ROOT_PASSWORD: 12345678jmp
      MYSQL_DATABASE: cv_infer
    ports:
      - "3306:3306"
    volumes:
      - ./init_db.sql:/docker-entrypoint-initdb.d/init_db.sql # 自动执行建表语句
    networks:
      - cv-network
     # 新增健康检查，每 5 秒探查一次 MySQL 是否准备好
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p12345678jmp"]
      interval: 5s
      timeout: 5s
      retries: 10

  # C++ AI 推理网关服务
  cv-infer-gate:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: cv_infer_gate
    ports:
      - "50051:50051"
    depends_on:
      mysql-db:
        condition: service_healthy # 等 mysql-db 健康检查通过后再启动
    # depends_on:
    #   - mysql-db
    networks:
      - cv-network
    # # 覆盖配置文件里的数据库地址，指向 docker 网络内的 mysql 服务
    # environment:
    #   - DB_HOST=tcp://mysql-db:3306
    # 注意：程序目前是读 config.yaml，如果要在 docker 里动态改，需要在代码里支持环境变量，或者挂载 config 文件
    volumes:
      - ../config:/app/config
      - ../models:/app/models
      - ../test.mp4:/app/test.mp4 
      - ../output:/app/output  # 拿到处理后的视频

  # ==========================================================
  # [T37] Phase C 复核服务(真 VLM) —— 可选, 隔离在 profile 内
  # ----------------------------------------------------------
  # 默认 `docker compose up` **不会**启动它; 需要时:
  #     docker compose --profile vlm up -d vlm-review
  #
  # 本容器只做 gRPC↔HTTP 适配, 上游 VLM 由 VLM_BASE_URL 指向
  # (宿主机上的 vLLM/Ollama/云 API, 用 host.docker.internal 回访宿主机)。
  #
  # ⚠️ 让 C++ 网关用上它: 需把 config.yaml 的 review.endpoint 从
  #    127.0.0.1:50052 改成容器网络内的 vlm-review:50052。
  #    (config/ 是挂载进去的, 改宿主机文件即可, 但注意 127.0.0.1 在
  #     容器内指向容器自身, 不会命中本服务。)
  # ==========================================================
  vlm-review:
    build:
      context: ..
      dockerfile: vlm_review/Dockerfile
    container_name: cv_infer_vlm_review
    profiles: ["vlm"]
    environment:
      VLM_BACKEND: ${VLM_BACKEND:-openai}
      VLM_BASE_URL: ${VLM_BASE_URL:-http://host.docker.internal:8000/v1}
      VLM_MODEL: ${VLM_MODEL:-Qwen/Qwen2.5-VL-7B-Instruct}
      VLM_API_KEY: ${VLM_API_KEY:-EMPTY}
      VLM_PORT: "50052"
      VLM_MAX_WORKERS: "4"
    ports:
      - "50052:50052"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Linux 下让容器能回访宿主机
    restart: unless-stopped
    networks:
      - cv-network

networks:
  cv-network:
    driver: bridge