
# ============================================================
# [P0-2] 所有口令/密钥走环境变量 —— 在本目录建 docker/.env(.gitignore 已忽略):
#     MYSQL_ROOT_PASSWORD=<MySQL root 口令>
#     DB_PASSWORD=<C++ 网关连库口令, 一般同上>
#     VLM_AUTH_TOKEN=<[T41] 复核服务端/客户端共享 token; 留空 = 不鉴权>
#     GRPC_AUTH_TOKEN=<[T42] 主服务(50051) token; 留空 = 不鉴权。
#                     网关(宿主机跑的 web_gateway)要用**同一个**值>
#     ALERT_PUSH_URL/ALERT_TOKEN=<[T43] 告警 webhook 地址/自定义头 token>
#                     接收端跑在宿主机时: ALERT_PUSH_URL=http://host.docker.internal:8899/alert
#                     (本服务的 extra_hosts 已把该名字指向宿主机)
# 不建 .env 也能起, 但 MySQL 会因空口令初始化失败 / 网关连库失败降级写 CSV。
# ============================================================

services:
  # MySQL 数据库服务
  mysql-db:
    image: mysql:8.0
    container_name: cv_infer_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-}
      MYSQL_DATABASE: cv_infer
    ports:
      - "3306:3306"
    volumes:
      - ./init_db.sql:/docker-entrypoint-initdb.d/init_db.sql # 自动执行建表语句
    networks:
      - cv-network
     # 新增健康检查，每 5 秒探查一次 MySQL 是否准备好
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10

  # C++ AI 推理网关服务
  cv-infer-gate:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: cv_infer_gate
    ports:
      - "50051:50051"
    # [T43] /metrics 只在容器网络内可见(Prometheus 直接抓 cv-infer-gate:9100);
    # 需要从宿主机 curl 调试时, 把下边这行取消注释(注意: 指标端点**无鉴权**)。
    expose:
      - "9100"
    #  - "9100:9100"
    depends_on:
      mysql-db:
        condition: service_healthy # 等 mysql-db 健康检查通过后再启动
    # depends_on:
    #   - mysql-db
    networks:
      - cv-network
    # [P0-2] 口令/密钥走环境变量: compose 自动读同目录 docker/.env。
    # 之所以能生效: config/ 里的 yaml 写的是 ${VAR}, ConfigParser::expandEnv 会展开,
    # 所以 config.yaml 用 `password: "${DB_PASSWORD:-}"`、`review.auth_token: "${VLM_TOKEN:-}"`
    # 就能被这里的变量注入 —— 不需要改代码(旧注释说的"需要在代码里支持环境变量"已不准确)。
    environment:
      DB_PASSWORD: ${DB_PASSWORD:-}
      VLM_TOKEN: ${VLM_AUTH_TOKEN:-}      # [T41] 与 vlm-review 的 VLM_AUTH_TOKEN 配对
      GRPC_AUTH_TOKEN: ${GRPC_AUTH_TOKEN:-}  # [T42] 主服务鉴权; config 里写 "${GRPC_AUTH_TOKEN:-}" 即生效
      DB_HOST: tcp://mysql-db:3306        # 仅当 config.yaml 的 database.host 写成 ${DB_HOST:-...} 才生效
      ALERT_PUSH_URL: ${ALERT_PUSH_URL:-} # [T43] 告警 webhook(空 => 用 config 里的默认值)
      ALERT_TOKEN: ${ALERT_TOKEN:-}       # [T43] 推送自定义头 x-alert-token 的值(空 => 不带头)
    volumes:
      - ../config:/app/config
      - ../models:/app/models
      - ../test.mp4:/app/test.mp4 
      - ../output:/app/output  # 拿到处理后的视频
    # ==========================================================
    # [T43] 健康检查: 直接问 gRPC 的 Health RPC(不加载模型/不连库, 秒级返回)
    #   为什么不 curl /metrics: 指标端点默认只在容器内网; 而且"进程在跑"
    #   不等于"gRPC 在服务" —— 探针要测的是后者。
    #   注意: 不要额外传 --config(让探针与服务端用**同一套**配置解析,
    #   包括 GRPC_AUTH_TOKEN / CVINFER_CONFIG), 否则口令或端口可能对不上。
    #   start_period 要盖住"模型加载 + 引擎池预热"的时间。
    # ==========================================================
    healthcheck:
      test: ["CMD", "./CVInfer-Gate", "--health-check"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    # [T43] 让容器能回访宿主机(告警 webhook 常跑在宿主机的 8899 上)
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ==========================================================
  # [T37] Phase C 复核服务(真 VLM) —— 可选, 隔离在 profile 内
  # ----------------------------------------------------------
  # 默认 `docker compose up` **不会**启动它; 需要时:
  #     docker compose --profile vlm up -d vlm-review
  #
  # 本容器只做 gRPC↔HTTP 适配, 上游 VLM 由 VLM_BASE_URL 指向
  # (宿主机上的 vLLM/Ollama/云 API, 用 host.docker.internal 回访宿主机)。
  #
  # ⚠️ 让 C++ 网关用上它: 需把 config.yaml 的 review.endpoint 从
  #    127.0.0.1:50052 改成容器网络内的 vlm-review:50052。
  #    (config/ 是挂载进去的, 改宿主机文件即可, 但注意 127.0.0.1 在
  #     容器内指向容器自身, 不会命中本服务。)
  # ==========================================================
  vlm-review:
    build:
      context: ..
      dockerfile: vlm_review/Dockerfile
    container_name: cv_infer_vlm_review
    profiles: ["vlm"]
    environment:
      VLM_BACKEND: ${VLM_BACKEND:-openai}
      VLM_BASE_URL: ${VLM_BASE_URL:-http://host.docker.internal:8000/v1}
      VLM_MODEL: ${VLM_MODEL:-Qwen/Qwen2.5-VL-7B-Instruct}
      VLM_API_KEY: ${VLM_API_KEY:-EMPTY}
      VLM_AUTH_TOKEN: ${VLM_AUTH_TOKEN:-}   # [T41] 空 = 不校验; 与网关的 VLM_TOKEN 配对
      VLM_PORT: "50052"
      VLM_MAX_WORKERS: "4"
    ports:
      - "50052:50052"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Linux 下让容器能回访宿主机
    restart: unless-stopped
    networks:
      - cv-network

networks:
  cv-network:
    driver: bridge